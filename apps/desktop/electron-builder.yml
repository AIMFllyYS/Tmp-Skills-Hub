appId: "dev.skills-hub.desktop"
productName: "Skills Hub"
directories:
  output: "release"
npmRebuild: false
nodeGypRebuild: false
files:
  - "dist/**"
  - "package.json"
  - "!node_modules/**"
extraResources:
  - from: "build/icon.ico"
    to: "icon.ico"
  - from: "../web/dist"
    to: "web"
  - from: "../../packages/cli/self-skill"
    to: "self-skill"
win:
  icon: "build/icon.ico"
  target:
    - "nsis"
    - "portable"
nsis:
  oneClick: false
  allowElevation: false
  installerLanguages: ["zh_CN"]
  language: "2052"
  include: "build/installer.nsh"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeaderIcon: "build/icon.ico"
  deleteAppDataOnUninstall: false
mac:
  target:
    - "dmg"
  identity: null
linux:
  target:
    - "AppImage"
